<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>웨딩홀 노트 – 모바일 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--dark:#2B2522;--gray:#8A817C;--light:#A39A94;--ph:#B8AFA9;--rose:#A85C66;--rose-t:#F6E6E8;--rose-bg:#FBF1F2;--bg:#F8F5F2;--line:#ECE5DF;--track:#EFE9E4;--sat:#5B7BA8;--green:#4F7358;--green-t:#E4EDE6;--amber:#9A7230;--amber-t:#F5ECDB;--gold:#D9A441}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;background:#E7E1DC;color:var(--dark);letter-spacing:-0.015em;display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
svg{display:block;flex:none}
.device{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 30px 80px rgba(60,40,30,.25),0 0 0 10px #1d1a19,0 0 0 11px #3a3533}
@media (max-width:500px){body{display:block;background:var(--bg)}.device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.sbar,.hind{display:none!important}.scroll{padding-top:env(safe-area-inset-top)}}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 10px 30px;font-weight:700;font-size:15px}
.hind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--dark);transform:translateX(-50%);z-index:60;pointer-events:none}
.hind.light{background:#fff}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}
.px20{padding-left:20px;padding-right:20px}.pb12{padding-bottom:12px}.pb20{padding-bottom:20px}
.rose{color:var(--rose)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 20px}
.eyebrow{font-size:13px;font-weight:500;color:var(--rose)}
h1{font-size:24px;font-weight:700;line-height:1.35}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.icon-btn.plain{background:none;border:0;width:36px}
.icon-btn svg{width:20px;height:20px}.icon-btn.plain svg{width:24px;height:24px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:15px;outline:none}
.search:focus,.inp:focus,.ta:focus{border-color:var(--rose)}
/* carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scrollbar-width:none;scroll-padding:0 20px}
.carousel::-webkit-scrollbar{display:none}
.hero{flex:0 0 calc(100% - 28px);scroll-snap-align:start;border-radius:20px;padding:20px 20px 20px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;cursor:pointer;background:linear-gradient(135deg,#B66B74,#8F4A54)}
.carousel.single .hero{flex-basis:100%}
.hero.alt{background:linear-gradient(135deg,#9C7A86,#6E5260)}
.hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-60px}
.dday{background:rgba(255,255,255,.22);font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.hero-label{font-size:13px;font-weight:500;opacity:.9}
.hero-name{font-size:22px;font-weight:700}
.hero-sub{font-size:13px;opacity:.8}
.hero-info{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.hero-info div{display:flex;align-items:center;gap:6px}.hero-info svg{width:16px;height:16px;opacity:.85}
.hero.empty{background:#fff;color:var(--gray);border:1px dashed #D9CFC8;align-items:center;text-align:center;font-size:14px;gap:10px}
.hero.empty::after{display:none}
.pager{display:flex;justify-content:center;gap:5px;padding-top:12px}
.pager i{width:6px;height:6px;border-radius:3px;background:#D9CFC8;transition:.2s}.pager i.on{width:16px;background:var(--rose)}
.sec-hd{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 12px}
.sort{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:500;color:var(--gray)}.sort svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.chip{flex:none;display:flex;gap:4px;align-items:center;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500}
.chip small{color:var(--light);font-size:13px}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}.chip.on small{color:#C9C0BA}
.list{display:flex;flex-direction:column;gap:12px}
.vcard{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 12px rgba(64,46,38,.06);cursor:pointer}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;line-height:1.45}
.heart svg{width:22px;height:22px;color:#C9C0BA}.heart.on svg{color:var(--rose);fill:var(--rose)}
.vname{font-size:18px;font-weight:700}
.vsub{font-size:13px;color:var(--gray)}
.grid3{display:flex;align-items:center;background:var(--bg);border-radius:12px;padding:12px 4px}
.grid3>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.grid3 span{font-size:11px;color:var(--light)}.grid3 b{font-size:13px;font-weight:500}
.grid3 i{width:1px;height:28px;background:var(--line)}
.memo-prev{display:flex;gap:6px;color:var(--gray);font-size:13px;line-height:1.5}
.memo-prev svg{width:16px;height:16px;color:var(--light);margin-top:2px}
.memo-prev p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-box{text-align:center;color:var(--light);font-size:14px;padding:40px 0}
.fab{position:absolute;right:20px;bottom:100px;z-index:20;display:flex;align-items:center;gap:6px;background:var(--dark);color:#fff;font-weight:700;font-size:15px;padding:14px 20px 14px 16px;border-radius:99px;box-shadow:0 6px 16px rgba(43,37,34,.25)}
.fab svg{width:20px;height:20px}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:10px 8px 30px;flex:none;z-index:15}
@media (max-width:500px){.nav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}.fab{bottom:calc(84px + env(safe-area-inset-bottom))}}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:#B3AAA4}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--rose);font-weight:700}
/* detail */
.topnav{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 4px 8px;min-height:48px}
.topnav b{font-size:16px}
.d-head{display:flex;align-items:center;gap:16px;padding:12px 20px 20px}
.d-info{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.stars{display:flex;align-items:center;gap:2px;font-size:14px}.stars svg{width:18px;height:18px}.stars b{margin-left:4px}.stars small{color:var(--light);font-size:13px;margin-left:4px}
.thumb{width:88px;height:88px;border-radius:16px;overflow:hidden;position:relative;flex:none;box-shadow:0 2px 8px rgba(64,46,38,.08)}
.thumb .cnt{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.45);color:#fff;font-size:10px;font-weight:500;padding:1px 6px;border-radius:99px}
.ph-fill{width:100%;height:100%;display:grid;place-items:center;position:relative}
.ph-fill svg{width:26px;height:26px;color:#fff;opacity:.7}
.ph-fill.doc{background:#fff!important}.ph-fill.doc svg{color:#C9C0BA;opacity:1;width:30px;height:30px}
.ph-fill img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.btn-outline{display:flex;justify-content:center;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 0;font-size:13px;font-weight:500;text-decoration:none;color:var(--dark)}
.btn-outline svg{width:18px;height:18px}
.sections{display:flex;flex-direction:column;gap:12px;padding:0 20px}
.card{background:#fff;border-radius:16px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 12px rgba(64,46,38,.05)}
.card-hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card-hd .acts{display:flex;align-items:center;gap:12px}
.toggle,.edit{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--gray)}
.edit{color:var(--light)}.toggle svg,.edit svg{width:15px;height:15px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:14px}
.kv span{color:var(--gray);flex:none}.kv b{font-weight:500;text-align:right}.kv b.strong{font-weight:700}.kv b.none{color:#C2BAB4;font-weight:400}
.para{padding:6px 0;font-size:14px;display:flex;flex-direction:column;gap:3px}.para span{color:var(--gray)}.para b{font-weight:500;line-height:1.5}
.summary{font-size:14px;font-weight:500}.summary.none{color:#C2BAB4;font-weight:400}
.note{font-size:12px;color:var(--light)}
.quote{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.q-hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
.qno{background:var(--rose);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:6px}
.q-hd b{font-size:15px}.q-hd small{font-size:12px;color:var(--light)}
.divider{height:1px;background:var(--line);margin:6px 0}
.total{background:#fff;border-radius:10px;padding:12px 14px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.total .row b:last-child{color:var(--rose);font-size:18px}.total small{font-size:12px;color:var(--gray)}
.dashed{display:flex;justify-content:center;align-items:center;gap:6px;border:1px dashed #D9CFC8;border-radius:12px;padding:13px 0;font-size:14px;font-weight:500;color:var(--rose);background:#fff;width:100%}
.dashed svg{width:16px;height:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:5px 10px;border-radius:8px}
.tag.pro{background:var(--green-t);color:var(--green)}.tag.con{background:var(--amber-t);color:var(--amber)}
.tag button{font-size:14px;line-height:1;color:inherit;opacity:.8}
.del-btn{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#C2554A;background:#FBEDEB;border-radius:99px;padding:5px 10px}.del-btn svg{width:14px;height:14px}
.del-link{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:14px 0;font-size:13px;font-weight:500;color:#C2554A}.del-link svg{width:15px;height:15px}
.memo-item{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.memo-item+.memo-item{border-top:1px solid var(--line);padding-top:12px}
.memo-item small{font-size:12px;color:var(--light);font-weight:500;display:flex;justify-content:space-between}
.memo-item p{font-size:14px;line-height:1.55;white-space:pre-wrap}
.memo-bar{display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid var(--line);padding:10px 16px 34px;flex:none}
@media (max-width:500px){.memo-bar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
.memo-bar input{flex:1;height:44px;border-radius:22px;background:var(--bg);border:0;padding:0 16px;font-size:14px;outline:none}
.send{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center}.send svg{width:20px;height:20px}
/* form */
.form{display:flex;flex-direction:column;gap:32px;padding:16px 20px 32px}
.fsec{display:flex;flex-direction:column;gap:16px}
.fsec>header h2{font-size:17px}.fsec>header p{font-size:13px;color:var(--light);margin-top:2px}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.lbl{font-size:13px;font-weight:500;color:var(--gray)}.lbl i{color:var(--rose);font-style:normal;font-weight:700;margin-left:2px}
.box{height:48px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;min-width:0}
.box:focus-within{border-color:var(--rose)}
.box.ro{background:#F1ECE7;border-color:transparent}
.inp{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;height:100%;text-align:left;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp::placeholder,.inp .ph{color:var(--ph)}
.box .suf{font-size:15px;font-weight:500;color:var(--gray);flex:none}
.box svg{width:20px;height:20px;color:var(--light)}
.box.err{border-color:#D46A5B}
.frow{display:flex;gap:10px}
.helper{font-size:12px;color:var(--light);margin-top:-8px}
.opts{display:flex;gap:8px}
.opt{flex:1;height:48px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;white-space:nowrap;padding:0 4px}
.opt.on{background:var(--rose-bg);border-color:var(--rose);color:var(--rose);font-weight:700}
.seg{display:flex;gap:4px;background:var(--track);border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:14px;font-weight:500;color:var(--gray)}
.seg button.on{background:#fff;color:var(--rose);font-weight:700;box-shadow:0 1px 4px rgba(50,38,30,.08)}
.ta{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;font-size:15px;outline:none;resize:none;line-height:1.5}
.ta::placeholder{color:var(--ph)}
.qbox{background:#FCFAF8;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.qbox-hd{display:flex;justify-content:space-between;align-items:center}
.qbox-hd b{font-size:14px}.qbox-hd .rm{font-size:12px;color:var(--light)}
.est{background:var(--rose-bg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.est .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid rgba(168,92,102,.15)}
.est .top b:first-child{font-size:15px}.est .top b:last-child{font-size:20px;color:var(--rose)}
.est .r{display:flex;justify-content:space-between;font-size:13px;color:var(--gray)}
.osec{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.osec-hd{width:100%;display:flex;align-items:center;gap:12px;padding:16px;text-align:left}
.osec-hd>div{flex:1}.osec-hd b{font-size:16px;display:block}.osec-hd small{font-size:12px;color:var(--light)}
.prog{font-size:12px;font-weight:500;color:var(--gray);background:var(--bg);padding:3px 8px;border-radius:99px;white-space:nowrap}
.prog.full{background:var(--green-t);color:var(--green)}
.osec-hd svg{width:18px;height:18px;color:var(--gray);transition:.2s}
.osec.open .osec-hd svg{transform:rotate(180deg)}
.osec-body{display:none;padding:0 16px 20px;flex-direction:column;gap:16px}
.osec.open .osec-body{display:flex}
.rating{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rating .st{display:flex;gap:8px}.rating .st button svg{width:36px;height:36px}
.rating p{font-size:13px;color:var(--gray)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:48px}
.tagbox input{flex:1;min-width:120px;border:0;outline:none;font-size:14px;background:none;height:30px}
.tagbox input::placeholder{color:var(--ph)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font-size:12px;color:var(--gray);border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px}
.cta{background:#fff;border-top:1px solid var(--line);padding:12px 20px 34px;flex:none}
@media (max-width:500px){.cta{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
.btn-primary{width:100%;height:52px;border-radius:14px;background:var(--rose);color:#fff;font-size:16px;font-weight:700}
.btn-sub{width:100%;height:52px;border-radius:14px;background:var(--track);font-size:16px;font-weight:700;color:var(--dark)}
/* sheet */
.overlay{position:absolute;inset:0;background:rgba(30,25,22,.45);z-index:50;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 40px;display:flex;flex-direction:column;gap:16px;max-height:88%;overflow-y:auto;animation:up .25s ease-out}
@media (max-width:500px){.sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
.grab{width:36px;height:4px;border-radius:2px;background:#DDD5CF;align-self:center}
.sheet-hd{display:flex;justify-content:space-between;align-items:center}.sheet-hd h3{font-size:18px}.sheet-hd svg{width:22px;height:22px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.cal-nav{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.cal-nav button.circle{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.cal-nav svg{width:18px;height:18px}.cal-nav b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cal .wd{font-size:12px;font-weight:500;color:var(--light);padding:6px 0 8px}
.cal .wd.sun,.cal .d.sun{color:var(--rose)}.cal .wd.sat,.cal .d.sat{color:var(--sat)}
.cal .d{height:44px;display:grid;place-items:center;font-size:15px}
.cal .d span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.cal .d.sel span{background:var(--rose);color:#fff;font-weight:700}
.cal .d.past{opacity:.45}
.picked{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.picked span{font-size:14px;color:var(--gray)}.picked b{font-size:16px;color:var(--rose)}
.menu-item{display:flex;align-items:center;gap:10px;padding:14px 4px;font-size:15px;font-weight:500;width:100%;text-align:left}
.menu-item svg{width:20px;height:20px}.menu-item.danger{color:#C2554A}
/* compare */
.sel-chips{display:flex;gap:8px;padding:0 20px 20px;flex-wrap:wrap}
.sel-chip{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px 7px 12px;font-size:13px;font-weight:500}
.sel-chip svg{width:14px;height:14px;color:var(--light)}
.sel-add{width:34px;height:34px;border-radius:50%;border:1px dashed #D9CFC8;background:#fff;display:grid;place-items:center}.sel-add svg{width:16px;height:16px;color:var(--gray)}
.insights{display:flex;gap:8px;padding:0 20px 16px}
.ins{flex:1;background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 12px rgba(64,46,38,.05);display:flex;flex-direction:column;gap:2px;min-width:0}
.ins small{font-size:11px;font-weight:500;color:var(--light)}.ins b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ins b.rose{color:var(--rose)}
.ctable{margin:0 20px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(64,46,38,.05)}
.ctable table{width:100%;border-collapse:collapse;table-layout:fixed}
.ctable th{background:#FBF8F6;padding:16px 4px 14px;font-size:14px;vertical-align:top;cursor:pointer}
.ctable th:first-child{width:78px}
.ctable th .badge{font-size:11px;padding:2px 8px;margin-top:6px}
.ctable td{border-top:1px solid var(--line);padding:12px 4px;font-size:14px;font-weight:500;text-align:center;word-break:keep-all}
.ctable td:first-child{text-align:left;padding-left:14px;font-size:12px;color:var(--gray)}
.ctable td.best{background:var(--rose-bg);color:var(--rose);font-weight:700}

let venues=[];let MODE='loading';let DB=null,ASSETS=null;let loadNote='';let readOnly=false;let pendingRender=false;
function loadLocal(){let l;try{l=JSON.parse(localStorage.getItem(KEY))}catch(e){}venues=Array.isArray(l)&&l.length?l:seed()}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(venues))}catch(e){toast('이 기기에 다 저장하지 못했어요 (사진 용량)')}}
function dbErr(e){const c=e&&e.code;if(c==='invalid_argument'){readOnly=true;toast('이 링크에서는 보기만 할 수 있어요')}else if(c==='quota_exceeded')toast('저장 공간이 가득 찼어요');else if(c==='revoked')toast('접근 권한이 바뀌어 저장할 수 없어요');else toast('저장하지 못했어요. 잠시 후 다시 해주세요')}
const chains={},timers={};
function persist(v,delay){if(!v)return;if(MODE!=='db'){saveLocal();return}
 clearTimeout(timers[v.id]);
 const run=()=>{const body=clone(v);delete body.id;const write=()=>DB.doc('venues/'+v.id).set(body);
  chains[v.id]=(chains[v.id]||Promise.resolve()).then(write).catch(e=>e&&e.code==='unavailable'?new Promise(r=>setTimeout(r,600+Math.random()*600)).then(write).catch(dbErr):dbErr(e))};
 if(delay)timers[v.id]=setTimeout(run,delay);else run()}
function removeVenueDoc(v){if(MODE!=='db'){saveLocal();return}
 (chains[v.id]||Promise.resolve()).then(()=>DB.doc('venues/'+v.id).delete()).catch(dbErr);
 if(ASSETS)v.photos.forEach(p=>{if(p.assetId)ASSETS.delete(p.assetId).catch(()=>{})})}
const photoSrc=p=>p.assetId?'/_blob/'+p.assetId:p.src;
const byId=id=>venues.find(v=>v.id===id);
const calcQ=(v,q)=>{const meal=num(q.meal),g=num(q.minGuests),rental=num(q.rental);const totalMeal=meal&&g?meal*g:0;const vat=(v.common&&v.common.vat==='별도')?Math.round((rental+totalMeal)*0.1):0;return{totalMeal,rental,vat,total:rental+totalMeal+vat}};

/* ===================== state & nav ===================== */
const state={screen:'home',params:{},stack:[],filter:'all',sort:'date',manage:false,search:null,open:new Set(),compareIds:['v2','v3','v1'],cal:{month:todayStr.slice(0,7),sel:null,view:'cal'},photoCat:'전체',draft:null,sheet:null,picker:null,openSecs:new Set()};
const scrollMem={};
const skey=()=>state.screen+':'+(state.params.id||'')+':'+(state.params.mode||'');
function go(screen,params={}){saveScroll();state.stack.push({screen:state.screen,params:state.params});state.screen=screen;state.params=params;scrollMem[skey()]=0;render()}
function back(){saveScroll();const p=state.stack.pop();if(!p){state.screen='home';state.params={}}else{state.screen=p.screen;state.params=p.params}state.sheet=null;render()}
function tab(screen){state.stack=[];state.screen=screen;state.params={};state.sheet=null;render()}
function saveScroll(){const sc=$('#app .scroll');if(sc)scrollMem[skey()]=sc.scrollTop}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function render(){saveScroll();const app=$('#app');app.innerHTML=(SCREENS[state.screen]||SCREENS.home)()+sheetHTML()+pickerHTML();
 const sc=$('#app .scroll');if(sc)sc.scrollTop=scrollMem[skey()]||0;
 $('#hind').className='hind'+(state.screen==='viewer'?' light':'');
 afterRender()}
function afterRender(){const car=$('[data-carousel]');if(car){car.addEventListener('scroll',()=>{const cards=[...car.children];const i=Math.round(car.scrollLeft/(cards[0].offsetWidth+10));document.querySelectorAll('.pager i').forEach((d,k)=>d.classList.toggle('on',k===i))},{passive:true})}}

/* ===================== shared bits ===================== */
const badge=s=>{const st=STATUS[s]||STATUS.reserved;return `<span class="badge" style="background:${st.bg};color:${st.fg}">${st.label}</span>`};
const nav=cur=>`<nav class="nav">${[['home','홈',I.home],['schedule','일정',I.cal],['compare','비교',I.compare],['memo','메모',I.note]].map(([k,l,ic])=>`<button class="${cur===k?'on':''}" data-act="tab" data-to="${k}">${ic}${l}</button>`).join('')}</nav>`;
const starsHTML=(r,size)=>`<div class="stars">${[1,2,3,4,5].map(i=>I.star(i<=r?'#D9A441':'#DDD5CF')).join('')}${r?`<b>${(+r).toFixed(1)}</b>`:''}<small>${r?'우리 점수':'아직 점수 없음'}</small></div>`;
const photoFill=p=>p?(photoSrc(p)?`<div class="ph-fill"><img src="${esc(photoSrc(p))}" alt="" loading="lazy"></div>`:p.cat==='견적서'?`<div class="ph-fill doc">${I.doc}</div>`:`<div class="ph-fill" style="background:linear-gradient(135deg,${p.grad[0]},${p.grad[1]})">${I.image}</div>`):`<div class="ph-fill" style="background:linear-gradient(135deg,#EDE6E0,#CFC3BA)">${I.image}</div>`;
const kv=(l,v,o={})=>`<div class="kv"><span>${l}</span><b class="${has(v)?(o.strong?'strong':''):'none'}">${has(v)?esc(v):'-'}</b></div>`;
const para=(l,v,color)=>`<div class="para"><span>${l}</span><b style="${color&&has(v)?`color:${color}`:''}">${has(v)?esc(v):'-'}</b></div>`;
const upcoming=()=>venues.filter(v=>v.consult.date&&ddayN(v.consult.date)>=0).sort((a,b)=>(a.consult.date+a.consult.time).localeCompare(b.consult.date+b.consult.time));

/* ===================== HOME ===================== */
const SORTS={date:'상담일순',recent:'최근 추가순',score:'점수순'};
function filtered(){let l=venues.slice();if(state.filter!=='all')l=l.filter(v=>state.filter==='fav'?v.fav:v.status===state.filter);
 if(state.search)l=l.filter(v=>(v.name+v.hall+v.location).includes(state.search));

 if(state.sort==='recent')l.reverse();if(state.sort==='score')l.sort((a,b)=>(b.rating||0)-(a.rating||0));return l}
function vcard(v){const q=v.quotes[0]||{};const memo=v.memos.length?v.memos[v.memos.length-1].text:'';
 return `<article class="vcard" data-act="open" data-id="${v.id}"><div class="row between">${badge(v.status)}${state.manage?`<button class="del-btn" data-act="askDelCard" data-id="${v.id}">${I.trash}삭제</button>`:`<button class="heart ${v.fav?'on':''}" data-act="fav" data-id="${v.id}" aria-label="찜">${I.heart}</button>`}</div>
 <div><div class="vname">${esc(v.name)}</div><div class="vsub">${esc([v.hall,shortLoc(v.location)].filter(Boolean).join(' · '))}</div></div>
 <div class="grid3"><div><span>상담일</span><b>${v.consult.date?fmtMD(v.consult.date).replace(/^(\d\d)\./,'$1.')+' '+esc(v.consult.time||''):'-'}</b></div><i></i><div><span>식대</span><b>${has(q.meal)?man(q.meal):'-'}</b></div><i></i><div><span>보증인원</span><b>${has(q.minGuests)?q.minGuests+'명':'-'}</b></div></div>

function listHTML(){const l=filtered();return l.length?l.map(vcard).join(''):`<div class="empty-box">${state.search?'검색 결과가 없어요':'해당하는 업체가 없어요'}</div>`}

 return `<div class="scroll">${statusBar()}
 <header class="hd"><div><div class="eyebrow">우리의 웨딩홀 투어</div><h1>웨딩홀 노트</h1></div><div class="row gap8"><button class="icon-btn" data-act="toggleSearch" aria-label="검색">${I.search}</button><button class="icon-btn" data-act="toast" data-msg="알림 기능은 준비 중이에요" aria-label="알림">${I.bell}</button></div></header>
 ${state.search!=null?`<div class="px20 pb12"><input class="search" id="searchIn" data-search placeholder="업체명, 홀, 지역으로 찾기" value="${esc(state.search)}"></div>`:''}
${MODE==='loading'?`<div class="empty-box">${loadNote||'불러오는 중이에요…'}</div>`:up.length?`<div class="carousel ${up.length===1?'single':''}" data-carousel>${up.map((v,i)=>`<div class="hero ${i%2?'alt':''}" data-act="open" data-id="${v.id}"><div class="row gap8"><span class="dday">${dday(v.consult.date)}</span><span class="hero-label">다음 상담 일정</span></div><div><div class="hero-name">${esc(v.name)}</div><div class="hero-sub">${esc(v.hall||'')}</div></div><div class="hero-info"><div>${I.cal} ${fmtKor(v.consult.date)} ${fmtTime(v.consult.time)}</div>${v.location?`<div>${I.pin} ${esc(v.location)}</div>`:''}</div></div>`).join('')}</div>${up.length>1?`<div class="pager">${up.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}`
 :`<div class="px20"><button class="hero empty" data-act="newVenue">예정된 상담이 없어요<span class="dashed" style="width:auto;padding:8px 14px">${I.plus} 업체 추가하기</span></button></div>`}
 <div class="sec-hd"><div class="row gap6"><h2>업체 목록</h2><h2 class="rose">${venues.length}</h2></div><div class="row gap10">${state.manage?'':`<button class="sort" data-act="cycleSort">${SORTS[state.sort]} ${I.chevD}</button>`}<button class="sort" style="color:${state.manage?'var(--rose)':'var(--gray)'};font-weight:${state.manage?700:500}" data-act="toggleManage">${state.manage?'완료':'편집'}</button></div></div>
 <div class="chips px20">${[['all','전체'],['reserved','상담예약'],['done','상담완료'],['hold','보류'],['fav','찜']].map(([k,l])=>`<button class="chip ${state.filter===k?'on':''}" data-act="filter" data-k="${k}">${l}<small>${cnt(k)}</small></button>`).join('')}</div>
 <div class="list px20" id="venueList">${MODE==='loading'?'':listHTML()}</div>${loadNote&&MODE!=='loading'?`<p class="note" style="text-align:center;padding-top:12px">${loadNote}</p>`:''}<div style="height:150px"></div></div>
 ${state.manage?'':`<button class="fab" data-act="newVenue">${I.plus}업체 추가</button>`}${nav('home')}`};

 return `<section class="card"><div class="card-hd" data-act="toggle" data-key="${key}"><h3>${title}</h3><div class="acts">${open&&o.edit!==false?`<span class="edit" data-act="edit">${I.edit}수정</span>`:''}<span class="toggle">${open?'접기':'더보기'}${open?I.chevU:I.chevD}</span></div></div>${open?body:summary}</section>`}
const sumLine=arr=>{const a=arr.filter(Boolean);return a.length?`<div class="summary">${esc(a.join(' · '))}</div>`:`<div class="summary none">아직 입력 전이에요</div>`};
SCREENS.detail=()=>{const v=byId(state.params.id);if(!v)return SCREENS.home();
 const c=v.consult,cm=v.common,ml=v.meal,hl=v.hallInfo,pk=v.parking,pm=v.payment;const k=x=>v.id+':'+x;

  ${kv('대관료',has(q.rental)?(num(q.rental)===0?'0원 (식대 포함)':won(q.rental)):'')}${kv('식대 (1인)',won(q.meal))}${kv('최소 보증인원',has(q.minGuests)?q.minGuests+'명':'')}${kv('총 식대',t.totalMeal?won(t.totalMeal):'',{strong:1})}
  <div class="divider"></div>${para('당일 혜택 & 프로모션',q.promo,'var(--rose)')}
  <div class="total"><div class="row between"><b>예상 총 금액</b><b>${won(t.total)||'0원'}</b></div><small>대관료 ${won(t.rental)||'0원'} + 총 식대 ${won(t.totalMeal)||'0원'}${cm.vat==='별도'?` + 부가세 ${won(t.vat)}`:cm.vat==='포함'?' · 부가세 포함':''}</small></div></div>`}).join('');
 const memos=v.memos.slice().reverse();
 return `<div class="scroll">${statusBar()}
 <div class="topnav"><button class="icon-btn plain" data-act="back" aria-label="뒤로">${I.chevL}</button><b>업체 상세</b><div class="row"><button class="icon-btn plain heart ${v.fav?'on':''}" data-act="fav" data-id="${v.id}">${I.heart}</button><button class="icon-btn plain" data-act="more">${I.more}</button></div></div>
 <div class="d-head"><div class="d-info">${badge(v.status)}<h1>${esc(v.name)}</h1><div class="vsub" style="font-size:14px">${esc([v.hall,v.location].filter(Boolean).join(' · '))}</div>${starsHTML(v.rating)}</div>
  <button class="thumb" data-act="photos" aria-label="사진 보기">${photoFill(v.photos[0])}<span class="cnt">${v.photos.length}</span></button></div>
 <div class="px20 pb20"><a class="btn-outline" href="https://map.kakao.com/link/search/${encodeURIComponent(v.name||v.location||'')}" target="_blank" rel="noopener">${I.pin}카카오맵 길찾기</a></div>
 <div class="sections">
  ${coll(k('consult'),'상담 예약 정보',kv('상담 일시',consultWhen,{strong:1}),kv('상담 일시',consultWhen,{strong:1})+kv('담당 플래너',c.planner)+kv('연락처',c.phone)+kv('방문 인원',has(c.visitors)?c.visitors+'명':''))}
  <section class="card"><div class="card-hd"><h3>예식일별 견적</h3><span class="edit" data-act="edit">${I.edit}수정</span></div>${quotes||'<div class="summary none">아직 받은 견적이 없어요</div>'}<button class="dashed" data-act="addQuote">${I.plus}다른 예식일 견적 추가</button></section>

  ${coll(k('meal'),'식사',sumLine([ml.type,ml.alcohol&&'주류 '+ml.alcohol,ml.tasting==='가능'?`시식 ${has(ml.tastingCount)?ml.tastingCount+'인 ':''}가능`:ml.tasting==='불가'?'시식 불가':'']),kv('식사 형태',ml.type)+kv('주류 포함 여부',ml.alcohol)+kv('혼주 식사 공간',ml.parentsRoom)+kv('시식 가능 여부',ml.tasting?ml.tasting+(ml.tasting==='가능'&&has(ml.tastingCount)?` (${ml.tastingCount}인)`:''):''))}
  ${coll(k('hall'),'홀 정보',sumLine([hl.mood,has(hl.capacity)&&'착석 '+hl.capacity+'명',hl.lobby&&'로비 '+hl.lobby]),kv('전체적인 분위기',hl.mood)+kv('웨딩홀 수용인원',has(hl.capacity)?hl.capacity+'명 (착석)':'')+kv('로비 크기',hl.lobby)+kv('화환 반입',hl.wreath)+para('기본 꽃장식 구성',hl.flowers))}
  ${coll(k('parking'),'주차 · 교통',sumLine([has(pk.spots)&&pk.spots+'대',has(pk.freeHours)&&pk.freeHours+'시간 무료',pk.parentsParking&&'혼주 전용 '+pk.parentsParking]),kv('주차 가능 대수',has(pk.spots)?pk.spots+'대':'')+kv('주차 무료 시간',has(pk.freeHours)?pk.freeHours+'시간':'')+kv('혼주 전용 주차',pk.parentsParking)+kv('주차 편의성',pk.convenience)+para('대중교통 접근성',pk.transit))}

  <section class="card"><div class="card-hd"><h3>좋았던 점 · 아쉬운 점</h3><span class="edit" data-act="edit">${I.edit}수정</span></div>
   <div class="lbl">좋았던 점</div><div class="tags">${v.pros.map(t=>`<span class="tag pro">${esc(t)}</span>`).join('')||'<span class="summary none">-</span>'}</div>
   <div class="lbl">아쉬운 점</div><div class="tags">${v.cons.map(t=>`<span class="tag con">${esc(t)}</span>`).join('')||'<span class="summary none">-</span>'}</div></section>
  <section class="card"><div class="card-hd"><div class="row gap6"><h3>메모</h3><h3 class="rose">${v.memos.length}</h3></div></div>
   ${memos.map(m=>`<div class="memo-item"><small><span>${fmtMD(m.date)}${m.date===c.date?' · 상담 당일':''}</span><button data-act="delMemo" data-mid="${m.id}" aria-label="메모 삭제">${I.x.replace('<svg','<svg width="14" height="14"')}</button></small><p>${esc(m.text)}</p></div>`).join('')||'<div class="summary none">아래 입력창에서 바로 메모를 남겨보세요</div>'}</section>
  <button class="del-link" data-act="askDelVenue">${I.trash}이 업체 삭제</button><div style="height:12px"></div></div></div>
 <div class="memo-bar"><input id="quickMemo" placeholder="투어하면서 바로 메모 남기기" enterkeyhint="send"><button class="send" data-act="addMemo" aria-label="메모 저장">${I.arrowUp}</button></div>`};

/* ===================== FORM ===================== */
const OPT_SECS={meal:['식사','시식이 가능하면 인원도 함께 적어두세요',['meal.type','meal.alcohol','meal.parentsRoom','meal.tasting','meal.tastingCount']],
 hall:['홀 정보','직접 둘러보고 느낀 홀 정보를 남겨요',['hallInfo.mood','hallInfo.capacity','hallInfo.lobby','hallInfo.flowers','hallInfo.wreath']],
 parking:['주차 · 교통','하객이 오가기 편한지 확인해요',['parking.spots','parking.freeHours','parking.parentsParking','parking.convenience','parking.transit']],
 payment:['계약 · 결제 조건','계약 전에 꼭 확인해야 할 조건이에요',['payment.deposit','payment.middle','payment.balance','payment.refund']]};
const D=p=>getP(state.draft,p);
function fld(label,path,o={}){const val=D(path);const P='draft.'+path;let input;
 if(o.type==='date')input=`<button type="button" class="inp" data-act="pickDate" data-path="${P}" data-label="${label}">${val?fmtFull(val):`<span class="ph">YYYY.MM.DD</span>`}</button>${I.cal}`;
 else if(o.type==='time')input=`<input class="inp" data-path="${P}" data-time inputmode="numeric" maxlength="5" placeholder="HH:MM" value="${esc(val)}">${I.clock}`;
 else if(o.type==='num')input=`<input class="inp" data-path="${P}" data-num inputmode="numeric" placeholder="${o.ph||'0'}" value="${fmtNum(val)}">${o.suf?`<span class="suf">${o.suf}</span>`:''}`;
 else input=`<input class="inp" data-path="${P}" placeholder="${esc(o.ph||'')}" value="${esc(val)}" ${o.id?`id="${o.id}"`:''}>${o.icon||''}`;
 return `<div class="fld"><span class="lbl">${label}${o.req?'<i>*</i>':''}</span><div class="box">${input}</div></div>`}
function choice(label,path,opts){const val=D(path);return `<div class="fld"><span class="lbl">${label}</span><div class="opts">${opts.map(x=>`<button type="button" class="opt ${val===x?'on':''}" data-act="choose" data-path="draft.${path}" data-val="${x}">${x}</button>`).join('')}</div></div>`}
function area(label,path,ph){return `<div class="fld"><span class="lbl">${label}</span><textarea class="ta" data-path="draft.${path}" placeholder="${esc(ph)}">${esc(D(path))}</textarea></div>`}
const frow=(...a)=>`<div class="frow">${a.join('')}</div>`;
const help=t=>`<div class="helper">${t}</div>`;
function progOf(key){const f=OPT_SECS[key][2];return [f.filter(p=>has(D(p))).length,f.length]}

 return `<div class="fld"><span class="lbl">${k==='pros'?'좋았던 점':'아쉬운 점'}</span><div class="tagbox">${list.map((t,i)=>`<span class="tag ${cls}">${esc(t)}<button type="button" data-act="rmTag" data-k="${k}" data-i="${i}" aria-label="삭제">×</button></span>`).join('')}<input data-taginput="${k}" placeholder="입력 후 엔터로 추가" enterkeyhint="done"></div>

SCREENS.form=()=>{const d=state.draft;const isNew=state.params.mode==='new';
 const quotes=d.quotes.map((q,i)=>`<div class="qbox"><div class="qbox-hd"><div class="row"><span class="qno">견적 ${i+1}</span><b>${i===0?'첫 번째 예식일':'다른 예식일'}</b></div>${d.quotes.length>1?`<button type="button" class="rm" data-act="rmQuote" data-i="${i}">삭제</button>`:''}</div>
  ${frow(fld('희망 예식일',`quotes.${i}.weddingDate`,{type:'date'}),fld('예식 시간',`quotes.${i}.weddingTime`,{type:'time'}))}
  ${fld('대관료',`quotes.${i}.rental`,{type:'num',suf:'원'})}${help('식대에 포함된 경우 0원으로 입력해요')}
  ${frow(fld('식대 (1인)',`quotes.${i}.meal`,{type:'num',suf:'원'}),fld('최소 보증인원',`quotes.${i}.minGuests`,{type:'num',suf:'명'}))}
  <div class="fld"><span class="lbl">총 식대 (자동 계산)</span><div class="box ro"><span class="inp" style="color:var(--gray)" data-calc="meal" data-i="${i}">${fmtNum(calcQ(d,q).totalMeal)||'0'}</span><span class="suf" style="color:var(--light)">원</span></div></div>${help('식대(1인) × 최소 보증인원으로 자동 입력돼요')}
  ${area('당일 혜택 & 프로모션',`quotes.${i}.promo`,'예) 당일 계약 시 식대 3% 할인, 본식 스냅 제공')}
  <div class="est" data-calc="est" data-i="${i}">${estHTML(i)}</div></div>`).join('');
 const opt=(key,body)=>{const [t,desc]=OPT_SECS[key];const [a,b]=progOf(key);const open=state.openSecs.has(key);
  return `<section class="osec ${open?'open':''}" data-osec="${key}"><button type="button" class="osec-hd" data-act="toggleSec" data-k="${key}"><div><b>${t}</b><small>${desc}</small></div><span class="prog ${a===b?'full':''}" data-prog="${key}">${a}/${b} 입력</span>${I.chevD}</button><div class="osec-body">${body}</div></section>`};
 return `<div class="scroll">${statusBar()}
 <div class="topnav"><button class="icon-btn plain" data-act="back" aria-label="닫기">${I.x}</button><b>${isNew?'업체 추가':'업체 정보 수정'}</b><button style="font-size:13px;color:var(--gray);font-weight:500;width:56px" data-act="tempSave">${isNew?'임시저장':''}</button></div>
 <div class="form">
  <div class="fsec"><header><h2>기본 정보</h2></header>${fld('업체명','name',{req:1,ph:'예) 더채플앳청담',id:'nameIn'})}${fld('홀 이름','hall',{ph:'예) 커티지홀'})}${fld('위치','location',{ph:'예) 서울 강남구 청담동',icon:I.search})}</div>
  <div class="fsec"><header><h2>상담 예약</h2><p>상담 날짜를 넣으면 메인에서 D-day로 알려드려요</p></header>
   <div class="fld"><span class="lbl">진행 상태</span><div class="seg">${Object.entries(STATUS).map(([k,s])=>`<button type="button" class="${d.status===k?'on':''}" data-act="setStatus" data-k="${k}">${s.label}</button>`).join('')}</div></div>
   ${frow(fld('상담 날짜','consult.date',{type:'date'}),fld('시간','consult.time',{type:'time'}))}
   ${frow(fld('담당자','consult.planner',{ph:'이름'}),fld('연락처','consult.phone',{ph:'010-0000-0000'}))}${fld('방문 인원','consult.visitors',{type:'num',suf:'명'})}</div>
  <div class="fsec"><header><h2>예식일별 견적</h2><p>예식일마다 달라지는 금액만 입력해요</p></header>${quotes}<button type="button" class="dashed" data-act="formAddQuote">${I.plus}다른 예식일 견적 추가</button></div>
  <div class="fsec"><header><h2>업체 공통 조건</h2><p>예식일과 상관없이 같은 조건이에요. 한 번만 입력하면 모든 견적에 적용돼요</p></header>
   ${choice('보증인원 기준','common.basis',['양가 합산','양가 각각'])}${help('양가 합산: 양가 하객을 합쳐 보증 / 양가 각각: 신랑·신부 측 각각 보증')}
   ${choice('인원 변경 가능 여부','common.changeable',['가능','불가'])}${area('패키지 구성','common.pkg','예) 대관료, 기본 연출, 원판 촬영, 폐백 포함')}${area('추가 비용 발생 항목','common.extra','예) 생화 업그레이드, 영상 촬영, 주차 시간 연장')}
   ${frow(choice('부가세','common.vat',['포함','별도']),choice('카드 결제 수수료','common.cardFee',['있음','없음']))}</div>
  <div class="fsec"><header><h2>상세 정보</h2><p>필요한 항목만 펼쳐서 입력하세요. 나중에 채워도 돼요</p></header>
   ${opt('meal',choice('식사 형태','meal.type',['뷔페','코스','한상'])+frow(choice('주류 포함 여부','meal.alcohol',['포함','별도']),choice('혼주 식사 공간','meal.parentsRoom',['별도 제공','없음']))+frow(choice('시식 가능 여부','meal.tasting',['가능','불가']),fld('시식 인원','meal.tastingCount',{type:'num',suf:'명'})))}
   ${opt('hall',choice('전체적인 분위기','hallInfo.mood',['밝은 홀','어두운 홀'])+frow(fld('웨딩홀 수용인원','hallInfo.capacity',{type:'num',suf:'명',ph:'착석 기준'}),choice('로비 크기','hallInfo.lobby',['소','중','대']))+fld('기본 꽃장식 구성','hallInfo.flowers',{ph:'예) 생화, 버진로드 + 단상 장식'})+choice('화환 반입 가능 여부','hallInfo.wreath',['가능','불가']))}
   ${opt('parking',frow(fld('주차 가능 대수','parking.spots',{type:'num',suf:'대'}),fld('주차 무료 시간','parking.freeHours',{type:'num',suf:'시간'}))+choice('혼주 전용 주차','parking.parentsParking',['있음','없음'])+choice('주차 편의성','parking.convenience',['좋음','보통','나쁨','모름'])+fld('대중교통 접근성','parking.transit',{ph:'예) 2호선 강남역 도보 5분, 셔틀 운행'}))}
   ${opt('payment',fld('계약금','payment.deposit',{type:'num',suf:'원'})+fld('중도금','payment.middle',{type:'num',suf:'원'})+fld('잔금','payment.balance',{type:'num',suf:'원'})+area('환불 조건','payment.refund','예) 예식 90일 전 취소 시 계약금 전액 환불'))}</div>
  <div class="fsec"><header><h2>우리 점수</h2><p>둘러본 느낌을 별점으로 남기면 비교 화면에 반영돼요</p></header>
   <div class="rating"><div class="st">${[1,2,3,4,5].map(i=>`<button type="button" data-act="rate" data-val="${i}" aria-label="${i}점">${I.star(i<=d.rating?'#D9A441':'#E6DED8')}</button>`).join('')}</div><p>${d.rating?`${d.rating}.0점 · 다시 누르면 바꿀 수 있어요`:'별을 눌러 점수를 매겨주세요'}</p></div></div>
  <div class="fsec"><header><h2>좋았던 점 · 아쉬운 점</h2><p>태그로 남겨두면 업체끼리 비교하기 쉬워요</p></header>${tagEditor('pros',SUG_PROS)}${tagEditor('cons',SUG_CONS)}</div>
  ${!isNew?`<button type="button" class="del-link" style="margin-top:-8px" data-act="askDelVenue">${I.trash}이 업체 삭제</button>`:''}${isNew?`<div class="fsec"><header><h2>메모</h2></header><textarea class="ta" style="min-height:128px" data-path="draft._memo" placeholder="상담 때 물어볼 것, 둘러보며 느낀 점을 자유롭게 적어두세요" maxlength="500">${esc(d._memo||'')}</textarea></div>`:''}
 </div></div>
 <div class="cta"><button class="btn-primary" data-act="saveVenue">저장하기</button></div>`};

/* ===================== COMPARE ===================== */
SCREENS.compare=()=>{const sel=state.compareIds.map(byId).filter(Boolean);
 const q=v=>v.quotes[0]||{};const tot=v=>calcQ(v,q(v)).total;
 const pick=(fn,mode)=>{const xs=sel.map(v=>({v,n:fn(v)})).filter(x=>x.n);if(!xs.length)return null;return xs.sort((a,b)=>mode==='max'?b.n-a.n:a.n-b.n)[0].v};
 const best1=pick(v=>v.rating,'max'),best2=pick(v=>num(q(v).meal),'min'),best3=pick(tot,'min');
 const rows=[['우리 점수',v=>v.rating?'★ '+v.rating.toFixed(1):'',v=>v.rating,'max'],['식대 (1인)',v=>man(q(v).meal),v=>num(q(v).meal),'min'],['보증인원',v=>has(q(v).minGuests)?q(v).minGuests+'명':''],
  ['예상 총액',v=>tot(v)?man(tot(v)):'',tot,'min'],['대관료',v=>has(q(v).rental)?(num(q(v).rental)===0?'식대 포함':man(q(v).rental)):''],['부가세',v=>v.common.vat],['식사',v=>v.meal.type],
  ['주차',v=>has(v.parking.spots)?v.parking.spots+'대':'',v=>num(v.parking.spots),'max'],['홀 분위기',v=>v.hallInfo.mood],['상담일',v=>fmtMD(v.consult.date)],['한 줄 평',v=>v.pros[0]||v.cons[0]||'',null,null,'small']];
 const cell=(r,v)=>{const val=r[1](v);let cls='';if(!has(val))cls='dim';else if(r[3]&&sel.length>1){const b=pick(r[2],r[3]);if(b&&b.id===v.id)cls='best'}if(r[4]&&has(val))cls+=' small';return `<td class="${cls}">${has(val)?esc(val):(v.status==='reserved'&&r[0]==='우리 점수'?'상담 전':'-')}</td>`};
 return `<div class="scroll">${statusBar()}
 <header class="hd" style="align-items:flex-end;padding-bottom:16px"><div><div class="eyebrow">최대 3곳까지 나란히 비교해요</div><h1>업체 비교</h1></div></header>
 <div class="sel-chips">${sel.map(v=>`<button class="sel-chip" data-act="cmpRemove" data-id="${v.id}">${esc(v.name)}${I.x}</button>`).join('')}${sel.length<3?`<button class="sel-add" data-act="cmpAdd" aria-label="업체 추가">${I.plus}</button>`:''}</div>
 ${sel.length<2?`<div class="empty-box">2곳 이상 고르면 비교표가 나와요</div>`:`
 <div class="insights">${[['우리 점수 1위',best1,best1&&'★ '+best1.rating.toFixed(1)],['식대 최저',best2,best2&&man(q(best2).meal)],['예상 총액 최저',best3,best3&&man(tot(best3))]].map(([l,v,s])=>`<div class="ins"><small>${l}</small><b>${v?esc(v.name):'-'}</b><b class="rose">${s||'-'}</b></div>`).join('')}</div>
 <div class="ctable"><table><thead><tr><th></th>${sel.map(v=>`<th data-act="open" data-id="${v.id}">${esc(v.name)}<br>${badge(v.status)}</th>`).join('')}</tr></thead>
 <tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${sel.map(v=>cell(r,v)).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="legend"><i></i>항목별로 가장 유리한 업체를 표시했어요 · 금액은 견적 1 기준</div>`}
 <div style="height:40px"></div></div>${nav('compare')}`};

/* ===================== SCHEDULE ===================== */
function sitem(v,o={}){const st=STATUS[v.status];const d=parseD(v.consult.date);const n=ddayN(v.consult.date);
 return `<div class="sitem ${o.sel?'sel':''} ${n<0?'past':''}" data-act="open" data-id="${v.id}"><div class="dc"><b>${pad2(d.getDate())}</b><small style="color:${d.getDay()===0?'var(--rose)':d.getDay()===6?'var(--sat)':'var(--light)'}">${WD[d.getDay()]}</small></div><i class="bar" style="background:${st.fg}"></i>
 <div class="bd"><div class="tr"><span style="color:${n<0?'var(--gray)':'var(--rose)'}">${esc(v.consult.time||'')}</span>${badge(v.status)}${n>=0?`<em>${dday(v.consult.date)}</em>`:''}</div><div class="nm">${esc(v.name)}</div><div class="sb">${esc([v.hall,shortLoc(v.location)].filter(Boolean).join(' · '))}</div></div>${I.chevR}</div>`}
SCREENS.schedule=()=>{const cs=state.cal;const [Y,M]=cs.month.split('-').map(Number);const first=new Date(Y,M-1,1);const days=new Date(Y,M,0).getDate();
 const ev={};venues.forEach(v=>{if(v.consult.date)(ev[v.consult.date]=ev[v.consult.date]||[]).push(v)});
 const withDate=venues.filter(v=>v.consult.date);const up=withDate.filter(v=>ddayN(v.consult.date)>=0).sort((a,b)=>a.consult.date.localeCompare(b.consult.date));const past=withDate.filter(v=>ddayN(v.consult.date)<0).sort((a,b)=>b.consult.date.localeCompare(a.consult.date));
 let cells=WD.map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')+'<div></div>'.repeat(first.getDay());
 for(let d=1;d<=days;d++){const s=`${Y}-${pad2(M)}-${pad2(d)}`;const dow=(first.getDay()+d-1)%7;const e=ev[s];
  cells+=`<button class="d ${dow===0?'sun':dow===6?'sat':''} ${s<todayStr?'past':''} ${s===todayStr?'today':''} ${s===cs.sel?'sel':''}" data-act="calSel" data-date="${s}"><span>${d}</span><i class="dot" style="background:${e?STATUS[e[0].status].fg:'transparent'}"></i></button>`}
 const selList=cs.sel?(ev[cs.sel]||[]):[];
 return `<div class="scroll">${statusBar()}
 <header class="hd"><div><div class="eyebrow">다가오는 상담 ${up.length}건</div><h1>일정</h1></div><div class="vtoggle"><button class="${cs.view==='cal'?'on':''}" data-act="calView" data-k="cal" aria-label="달력">${I.cal}</button><button class="${cs.view==='list'?'on':''}" data-act="calView" data-k="list" aria-label="목록">${I.list}</button></div></header>
 ${cs.view==='cal'?`<div class="calcard"><div class="cal-nav"><button data-act="calMonth" data-d="-1">${I.chevL}</button><b>${Y}년 ${M}월</b><button data-act="calMonth" data-d="1">${I.chevR}</button></div><div class="cal">${cells}</div>
  <div class="lg">${Object.values(STATUS).map(s=>`<span><i style="background:${s.fg}"></i>${s.label}</span>`).join('')}</div></div>`:''}
 ${cs.sel&&cs.view==='cal'?`<div class="stitle">${fmtKor(cs.sel)}</div><div class="list px20">${selList.length?selList.map(v=>sitem(v,{sel:1})).join(''):'<div class="summary none" style="padding:4px 0">이 날은 일정이 없어요</div>'}</div>`:''}
 <div class="stitle">다가오는 일정 <span class="rose">${up.length}</span></div><div class="list px20">${up.map(v=>sitem(v,{sel:v.consult.date===cs.sel})).join('')||'<div class="summary none">예정된 상담이 없어요</div>'}</div>
 <div class="stitle">지난 일정</div><div class="list px20">${past.map(v=>sitem(v)).join('')||'<div class="summary none">아직 없어요</div>'}</div>
 <div style="height:150px"></div></div><button class="fab" data-act="newVenue">${I.plus}상담 일정 추가</button>${nav('schedule')}`};

/* ===================== MEMO TAB ===================== */
SCREENS.memo=()=>{const all=[];venues.forEach(v=>v.memos.forEach(m=>all.push({v,m})));all.sort((a,b)=>b.m.date.localeCompare(a.m.date));
 return `<div class="scroll">${statusBar()}<header class="hd"><div><div class="eyebrow">모든 업체 메모 ${all.length}개</div><h1>메모</h1></div></header>
 <div class="list px20">${all.map(({v,m})=>`<div class="mcard" data-act="open" data-id="${v.id}"><div class="row between"><span class="vn">${esc(v.name)}</span><small>${fmtMD(m.date)}</small></div><p>${esc(m.text)}</p></div>`).join('')||'<div class="empty-box">아직 메모가 없어요</div>'}</div>
 ${MODE==='db'?`<p class="note" style="text-align:center;padding:24px 20px">입력한 내용은 이 링크를 여는 모든 기기에서 똑같이 보여요</p>`:`<p class="note" style="text-align:center;padding:24px 20px 0">지금은 이 기기에만 저장돼요</p><button class="linkbtn" data-act="askReset">샘플 데이터로 되돌리기</button>`}<div style="height:20px"></div></div>${nav('memo')}`};

/* ===================== PHOTOS ===================== */
SCREENS.photos=()=>{const v=byId(state.params.id);if(!v)return SCREENS.home();const cat=state.photoCat;
 const list=v.photos.map((p,i)=>({p,i})).filter(x=>cat==='전체'||x.p.cat===cat);const groups={};list.forEach(x=>(groups[x.p.date]=groups[x.p.date]||[]).push(x));
 const cnt=c=>c==='전체'?v.photos.length:v.photos.filter(p=>p.cat===c).length;
 return `<div class="scroll">${statusBar()}
 <div class="topnav"><button class="icon-btn plain" data-act="back">${I.chevL}</button><div style="text-align:center"><b>사진 ${v.photos.length}</b><div style="font-size:11px;color:var(--light)">${esc(v.name)}</div></div><span style="width:36px"></span></div>

const appEl=$('#app');

 if(t.dataset.path){let val=t.value;
  if(t.hasAttribute('data-num')){const d=val.replace(/[^\d]/g,'');val=d?Number(d):'';t.value=d?Number(d).toLocaleString('ko-KR'):''}

 if(t.dataset.taginput){e.preventDefault();const k=t.dataset.taginput;const val=t.value.trim();if(val&&!state.draft[k].includes(val))state.draft[k].push(val);render();const n=$(`[data-taginput="${k}"]`);if(n)n.focus()}

$('#fileIn').addEventListener('change',async e=>{const v=byId(state.params.id);const files=[...e.target.files];e.target.value='';if(!v||!files.length)return;
 if(MODE==='db'&&!ASSETS){toast('사진은 편집 권한이 있는 사람만 올릴 수 있어요');return}
 toast('사진을 올리는 중이에요…');let ok=0;
 for(const f of files){try{const cat=state.photoCat!=='전체'?state.photoCat:'홀';
  if(MODE==='db'){const blob=await shrink(f,true);const r=await ASSETS.upload(blob);v.photos.push({id:uid(),cat,assetId:r.id,date:todayStr,memo:''})}
  else{const src=await shrink(f,false);v.photos.push({id:uid(),cat,src,date:todayStr,memo:''})}ok++}catch(err){}}
 persist(v);render();toast(ok?`사진 ${ok}장을 올렸어요`:'사진을 올리지 못했어요')});
function shrink(file,asBlob){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onload=()=>{const m=1200;let {width:w,height:h}=img;const s=Math.min(1,m/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  if(asBlob)c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82);else res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.readAsDataURL(file)})}
/* 화면 갱신: 입력 중에는 미뤘다가 입력이 끝나면 그린다 */

 if(typing||state.screen==='form'||state.sheet||state.picker){pendingRender=true;return}pendingRender=false;render()}
appEl.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)softRender()},300));
/* 시작: 공유 저장소 연결 */
(async()=>{let db=null;
 try{if(window.claude&&typeof claude.use==='function')db=await claude.use('db')}catch(e){}
 if(!db){MODE='local';loadLocal();render();return}
 DB=db;try{ASSETS=await claude.use('assets')}catch(e){ASSETS=null}
 const timer=setTimeout(()=>{if(MODE==='loading'){loadNote='데이터를 아직 불러오지 못했어요. 연결을 확인해주세요';render()}},10000);
 db.collection('venues').onSnapshot(snap=>{
  venues=snap.docs.map(d=>Object.assign(clone(d.data()),{id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const first=MODE!=='db';MODE='db';if(!snap.metadata.fromCache){clearTimeout(timer);loadNote=''}
  first?render():softRender()},
 e=>{clearTimeout(timer);if(MODE!=='db'){MODE='local';loadLocal();toast('공유 저장소에 연결하지 못해 이 기기에만 저장돼요')}else{loadNote='저장소 연결이 끊겼어요. 새로고침해 주세요'}render()});
})();
render();
</script>
</body>
</html>
